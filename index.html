  #cards::-webkit-scrollbar-thumb { background: #ddd; border-radius: 999px; }
  .card { flex: 0 0 auto; scroll-snap-align: start; width: min(88vw, 560px); background: #fff; border-radius: 20px; padding: 28px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }

  .art-der { background: #dbe8ff; } .art-die { background: #ffdede; } .art-das { background: #dcf3dd; }
  .word-line { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 12px; row-gap: 4px; margin-bottom: 4px; }
  .word { font-size: 32px; font-weight: 700; }
  .art { font-size: 20px; font-weight: 500; color: #777; }
  .extra { font-size: 15px; color: #999; }
  .ipa { font-size: 16px; color: #888; margin-bottom: 14px; }
  .btns { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

  .speak-btn:hover { background: #f5f5f5; }
  .meaning-box { padding-top: 16px; border-top: 1px solid #f0f0f0; }
  .info-label { display: block; font-size: 12px; color: #999; margin-bottom: 8px; }
  .meaning { font-size: 19px; margin: 0; }
  .example { border-left: 4px solid #222; padding: 10px 16px; margin: 16px 0 0; background: #fafafa; border-radius: 0 8px 8px 0; }
  .example .de { font-size: 17px; margin-bottom: 5px; }
  .example .ko { color: #666; font-size: 15px; }
  .ex-ipa { display: none; }
  footer { max-width: 900px; margin: 20px auto 0; text-align: center; color: #bbb; font-size: 12px; }
  @media (max-width: 480px) { .card { padding: 22px 18px; border-radius: 16px; } .word { font-size: 27px; } .ipa { font-size: 14px; } }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_','-').startsWith('de'));
    if (v) u.voice = v;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

      </div>
      <div class="meaning-box">
        <span class="info-label">뜻</span>
        <p class="meaning">${ko}</p>
      </div>
      <div class="example">
        <div class="de">${ex}</div>
        <div class="ko">${exko}</div>
      </div>`;
    card.querySelectorAll('.speak-btn').forEach(b => b.addEventListener('click', () => speak(b.dataset.t)));
    return card;
  }

  function render() {
    const list = pool();
    const box = document.getElementById('cards');
    box.innerHTML = '';
    shuffle([...list]).slice(0, PER_SET).forEach(w => box.appendChild(buildCard(w)));
    box.scrollTo({ left: 0 });
    document.getElementById('sub').textContent = `옆으로 스크롤하며 확인하세요 · 총 ${list.length}개 중 무작위 ${Math.min(PER_SET, list.length)}개`;
  }

  const chips = document.getElementById('chips');
  FILTERS.forEach(([k, label]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (k===filter ? ' on' : ''); b.textContent = label;
    b.addEventListener('click', () => {
      filter = k;
      chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
      render();
    });
    chips.appendChild(b);
  });

  document.getElementById('refreshBtn').addEventListener('click', render);
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
  render();
</script>
</body>
</html>
